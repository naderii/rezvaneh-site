```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رضوانه ❤️</title>

  <style>
    body{
      margin:0;
      padding:0;
      background:#fff5f7;
      font-family:tahoma;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
      color:#444;
    }

    .card{
      background:white;
      padding:40px;
      border-radius:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      max-width:700px;
      width:90%;
    }

    h1{
      font-size:48px;
      margin-bottom:10px;
      color:#ff5c8a;
    }

    .heart{
      font-size:60px;
      animation:beat 1.2s infinite;
      display:inline-block;
    }

    p{
      font-size:20px;
      line-height:2;
      margin-top:25px;
    }

    .footer{
      margin-top:35px;
      font-size:14px;
      color:#999;
    }

    @keyframes beat{
      0%{transform:scale(1);}
      50%{transform:scale(1.15);}
      100%{transform:scale(1);}
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>رضوانه</h1>

    <p>
      اگر الان این صفحه رو می‌بینی،
      یعنی بابات خیلی دوستت داشته که
      از وقتی فقط ۶ ماهت بوده
      برات یه گوشه کوچیک توی اینترنت ساخته ❤️
    </p>

    <p>
      امیدوارم همیشه سالم،
      خوشحال،
      قوی
      و پر از آرامش باشی.
    </p>

    <div class="footer">
      ساخته شده با عشق توسط بابا
    </div>

  </div>

</body>
</html>
```
